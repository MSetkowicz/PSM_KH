<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizacja Zamówienia - Kawa czy Herbata</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zeyada&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Style -->
    <link rel="stylesheet" href="style.css">


</head>
<body class="bg-light">

    <!-- Miejsce na wczytanie nawigacji z pliku navbar.html -->
    <div id="navbar-placeholder"></div>

    <!-- Nagłówek Podstrony Kasy -->
    <section class="page-header text-center">
        <div class="container">
            <h1 class="h2 fw-bold mb-0"><i class="fa-solid fa-credit-card me-2"></i>Finalizacja Zamówienia</h1>
        </div>
    </section>

    <!-- Główna Zawartość Kasy -->
    <main class="container py-5">
        <form id="checkoutForm" onsubmit="processOrder(event)">
            <div class="row g-4">
                
                <!-- Kolumna Formularza Danych -->
                <div class="col-lg-7">
                    
                    <!-- 1. Dane bilingowe i adres dostawy -->
                    <div class="checkout-card p-4 shadow-sm mb-4">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2"><i class="fa-solid fa-address-book text-warning me-2"></i>Dane adresowe i kontaktowe</h3>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Imię *</label>
                                <input type="text" class="form-control" id="firstName" value="Jan" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Nazwisko *</label>
                                <input type="text" class="form-control" id="lastName" value="Kowalski" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Ulica i numer *</label>
                                <input type="text" class="form-control" id="street" value="ul. Kwiatowa 12/4" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Kod pocztowy *</label>
                                <input type="text" class="form-control" id="zip" value="00-001" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Miasto *</label>
                                <input type="text" class="form-control" id="city" value="Warszawa" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Telefon *</label>
                                <input type="tel" class="form-control" id="phone" value="+48 600 700 800" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Adres e-mail (do potwierdzenia) *</label>
                                <input type="email" class="form-control" id="email" value="jan.kowalski@domena.pl" required>
                            </div>

                            <!-- Opcjonalny checkbox faktury na firmę -->
                            <div class="col-12 mt-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="companyInvoiceCheck" onchange="toggleCompanyFields()">
                                    <label class="form-check-label fw-semibold text-dark" for="companyInvoiceCheck">
                                        Chcę otrzymać fakturę na firmę
                                    </label>
                                </div>
                            </div>

                            <!-- Pola NIP i Nazwa firmy (ukryte domyślnie) -->
                            <div class="col-12 d-none" id="companyFieldsContainer">
                                <div class="row g-3 p-3 bg-light rounded-3 border">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">NIP firmy</label>
                                        <input type="text" class="form-control" id="companyNip" placeholder="np. 1234567890">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nazwa firmy</label>
                                        <input type="text" class="form-control" id="companyName" placeholder="np. Korporacja Sp. z o.o.">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Wybór metody dostawy -->
                    <div class="checkout-card p-4 shadow-sm mb-4">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2"><i class="fa-solid fa-truck-fast text-warning me-2"></i>Metoda dostawy</h3>
                        <div class="d-flex flex-column gap-2">
                            <div class="form-check border p-3 rounded-3">
                                <input class="form-check-input" type="radio" name="shippingMethod" id="shipCourier" value="15" checked onchange="updateCheckoutTotals()">
                                <label class="form-check-label d-flex justify-content-between w-100 fw-semibold" for="shipCourier">
                                    <span><i class="fa-solid fa-truck me-2"></i>Kurier DPD / DHL</span>
                                    <span class="text-dark">15,00 zł (Darmowa od 150 zł)</span>
                                </label>
                            </div>
                            <div class="form-check border p-3 rounded-3">
                                <input class="form-check-input" type="radio" name="shippingMethod" id="shipPaczkomat" value="12" onchange="updateCheckoutTotals()">
                                <label class="form-check-label d-flex justify-content-between w-100 fw-semibold" for="shipPaczkomat">
                                    <span><i class="fa-solid fa-box me-2"></i>Paczkomat InPost 24/7</span>
                                    <span class="text-dark">12,00 zł</span>
                                </label>
                            </div>
                            <div class="form-check border p-3 rounded-3">
                                <input class="form-check-input" type="radio" name="shippingMethod" id="shipPersonal" value="0" onchange="updateCheckoutTotals()">
                                <label class="form-check-label d-flex justify-content-between w-100 fw-semibold" for="shipPersonal">
                                    <span><i class="fa-solid fa-store me-2"></i>Odbiór osobisty (ul. Aromatyczna 12, Warszawa)</span>
                                    <span class="text-success">0,00 zł</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Wybór metody płatności -->
                    <div class="checkout-card p-4 shadow-sm">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2"><i class="fa-solid fa-wallet text-warning me-2"></i>Metoda płatności</h3>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <div class="form-check border p-3 rounded-3 h-100 d-flex align-items-center">
                                    <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payBlik" value="BLIK" checked>
                                    <label class="form-check-label fw-semibold" for="payBlik"><i class="fa-solid fa-mobile-screen me-1"></i> BLIK</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check border p-3 rounded-3 h-100 d-flex align-items-center">
                                    <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payCard" value="Karta">
                                    <label class="form-check-label fw-semibold" for="payCard"><i class="fa-regular fa-credit-card me-1"></i> Karta płatnicza</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check border p-3 rounded-3 h-100 d-flex align-items-center">
                                    <input class="form-check-input me-2" type="radio" name="paymentMethod" id="payTransfer" value="Przelew">
                                    <label class="form-check-label fw-semibold" for="payTransfer"><i class="fa-solid fa-building-columns me-1"></i> Szybki przelew</label>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Kolumna Skróconego Podsumowania Zamówienia -->
                <div class="col-lg-5">
                    <div class="checkout-card p-4 shadow-sm sticky-top" style="top: 90px;">
                        <h3 class="h5 fw-bold mb-3 border-bottom pb-2">Twoje zamówienie</h3>

                        <!-- Skrócona lista zakupów -->
                        <div id="checkoutItemsList" class="mb-3" style="max-height: 250px; overflow-y: auto;">
                            <!-- Renderowane przez JS -->
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-2 small">
                            <span class="text-muted">Wartość produktów:</span>
                            <span class="fw-semibold" id="summarySubtotal">0,00 zł</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3 small">
                            <span class="text-muted">Koszt dostawy:</span>
                            <span class="fw-semibold text-dark" id="summaryShipping">15,00 zł</span>
                        </div>

                        <div class="d-flex justify-content-between fs-5 fw-bold mb-4 border-top pt-3">
                            <span>Kwota całkowita:</span>
                            <span id="summaryTotal" class="text-danger">0,00 zł</span>
                        </div>

                        <!-- Wymagane checkboxy akceptacji regulaminu -->
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    Oświadczam, że zapoznałem się z <a href="#" class="text-dark fw-semibold">Regulaminem sklepu</a> i akceptuję jego postanowienia *
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="privacyCheck" required>
                                <label class="form-check-label small text-muted" for="privacyCheck">
                                    Wyrażam zgodę na przetwarzanie danych osobowych w celu realizacji zamówienia *
                                </label>
                            </div>
                        </div>

                        <!-- Główny przycisk finalizacji zakupu -->
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 rounded-pill shadow-sm mb-3">
                            Kupuję i płacę <i class="fa-solid fa-lock ms-2"></i>
                        </button>

                        <!-- Dodany przycisk powrotu do koszyka -->
                        <a href="koszyk.html" class="btn btn-outline-dark w-100 fw-semibold py-2 rounded-pill text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-2"></i>Powrót do koszyka
                        </a>
                    </div>
                </div>

            </div>
        </form>
    </main>

    <!-- Miejsce na wczytanie stopki z pliku footer.html -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Skrypty obsługa kasy -->
    <script>
        fetch('navbar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                updateCartBadge();
            });

        fetch('footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });

        let cart = JSON.parse(localStorage.getItem('kch_cart')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderCheckoutSummary();
        });

        function renderCheckoutSummary() {
            const container = document.getElementById('checkoutItemsList');
            if (cart.length === 0) {
                container.innerHTML = '<p class="small text-muted">Brak produktów w koszyku. <a href="oferta.html">Dodaj produkty</a></p>';
                return;
            }

            let html = '';
            cart.forEach(item => {
                const lineTotal = item.product.price * item.qty;
                html += `
                    <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
                        <div class="d-flex align-items-center gap-2">
                            <img src="${item.product.img}" class="summary-img shadow-sm" alt="">
                            <div>
                                <h6 class="small fw-bold mb-0 text-dark">${item.product.name}</h6>
                                <small class="text-muted" style="font-size: 0.75rem;">Ilość: ${item.qty} | ${item.variant}</small>
                            </div>
                        </div>
                        <span class="small fw-bold text-danger text-nowrap">${lineTotal.toFixed(2)} zł</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateCheckoutTotals();
        }

        function updateCheckoutTotals() {
            let subtotal = cart.reduce((acc, item) => acc + (item.product.price * item.qty), 0);
            document.getElementById('summarySubtotal').innerText = subtotal.toFixed(2) + ' zł';

            // Pobranie kosztu wybranej dostawy
            const selectedShippingRadio = document.querySelector('input[name="shippingMethod"]:checked');
            let shippingCost = selectedShippingRadio ? parseFloat(selectedShippingRadio.value) : 15.00;

            // Darmowa dostawa od 150 zł dla kuriera lub paczkomatu
            if (subtotal >= 150 && shippingCost > 0) {
                shippingCost = 0.00;
                document.getElementById('summaryShipping').innerText = 'Darmowa (od 150 zł)';
            } else if (shippingCost === 0) {
                document.getElementById('summaryShipping').innerText = '0,00 zł (Odbiór osobisty)';
            } else {
                document.getElementById('summaryShipping').innerText = shippingCost.toFixed(2) + ' zł';
            }

            const total = subtotal + shippingCost;
            document.getElementById('summaryTotal').innerText = total.toFixed(2) + ' zł';
        }

        function toggleCompanyFields() {
            const isChecked = document.getElementById('companyInvoiceCheck').checked;
            const container = document.getElementById('companyFieldsContainer');
            const nipInput = document.getElementById('companyNip');
            const nameInput = document.getElementById('companyName');

            if (isChecked) {
                container.classList.remove('d-none');
                nipInput.setAttribute('required', 'true');
                nameInput.setAttribute('required', 'true');
            } else {
                container.classList.add('d-none');
                nipInput.removeAttribute('required');
                nameInput.removeAttribute('required');
            }
        }

        function processOrder(e) {
            e.preventDefault();
            // Czyszczenie koszyka po zakupie
            localStorage.removeItem('kch_cart');
            
            // Symulacja komunikatu sukcesu i przekierowanie do konto.html
            alert('Sukces! Twoje zamówienie zostało pomyślnie złożone i opłacone. Trwa przekierowanie do panelu klienta...');
            window.location.href = 'konto.html';
        }

        function updateCartBadge() {
            const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
            const badge = document.getElementById('cartCountBadge');
            if (badge) badge.innerText = totalItems;
        }
    </script>
</body>
</html>
